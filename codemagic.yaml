workflows:
  unity-ios:
    name: Unity iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      vars:
        UNITY_VERSION: "2022.3.29f1"
        PROJECT_PATH: "."
        BUILD_PATH: "build/ios"

      unity: "2022.3.29f1"

      groups:
        - unity_credentials
        - app_store_credentials

    scripts:
      - name: Activate Unity License
        script: |
          unity-editor -batchmode -nographics -quit -username $UNITY_USERNAME -password $UNITY_PASSWORD -serial $UNITY_SERIAL

      - name: Build iOS Xcode Project
        script: |
          unity-editor -batchmode -nographics -projectPath $PROJECT_PATH -executeMethod BuildScript.BuildIOS -quit

      - name: Build IPA from Xcode Project
        script: |
          xcode-project build-ipa \
            --project "$BUILD_PATH/Unity-iPhone.xcodeproj" \
            --scheme Unity-iPhone \
            --export-method app-store

    artifacts:
      - build/ios/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
